# supabase/config.toml

project_id = "arena-local-dev"

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.settings]
# Ensures the ideological vector calculations process efficiently in memory
shared_buffers = "256MB"
max_connections = 100

[auth]
site_url = "exp://localhost:8081"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false # Set to false for seamless local development

